server:
  servlet:
    context-path: /
  port: 8083
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/example_mall?serverTimezone=Asia/Shanghai&useUnicode=true&tinyInt1isBit=false&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    #hikari数据库连接池
    hikari:
      pool-name: YH_HikariCP
      minimum-idle: 15 #最小空闲连接数量
      idle-timeout: 600000 #空闲连接存活最大时间，默认600000（10分钟）
      maximum-pool-size: 150 #连接池最大连接数，默认是10
      auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
      max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      connection-timeout: 3000 #数据库连接超时时间,30秒改为3秒，避免请求长时间挂起
      leak-detection-threshold: 5000 #连接泄漏检测，开启后会自动周期性的扫描连接池，如果发现连接泄漏，就会打印连接泄漏日志并关闭连接。默认值0，表示关闭连接泄漏检测，建议开启。
      connection-test-query: SELECT 1
  redis:
    host: localhost
    port: 6379
    password: 123456
    database: 0
    lettuce:
      pool:
        max-idle: 24 # 连接池中的最大空闲连接
        max-active: 64 # 连接池最大连接数（使用负值表示没有限制）
        min-idle: 12 # 连接池中的最小空闲连接
      shutdown-timeout: 2000  # 关闭连接的超时时间,单位毫秒
    timeout: 2000  # 全局命令超时时间
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
swagger:
  enabled: true
  packages: org.example.order.controller